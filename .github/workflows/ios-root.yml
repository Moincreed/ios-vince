name: ios-root
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Download IPSW
        run: |
          curl -sS -L --retry 3 -o ipsw.ipsw "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          ls -la ipsw.ipsw
      - name: Extract DMGs
        run: |
          mkdir -p dmgs
          unzip -o ipsw.ipsw "087-*.dmg" -d dmgs/ >/dev/null
          rm -f ipsw.ipsw
          ls -la dmgs/
          df -h /
      - name: Free disk space (remove Xcode)
        run: |
          sudo rm -rf /Applications/Xcode*.app || true
          df -h /
          df -h /System/Volumes/Data
      - name: Mount OS volume
        run: |
          hdiutil attach dmgs/087-86698-044.dmg -mountpoint /Volumes/os -nobrowse -readonly
          ls /Volumes/os/
      - name: Mount SystemOS cryptex
        run: |
          hdiutil attach dmgs/087-86593-047.dmg -mountpoint /Volumes/sysos -nobrowse -readonly
          ls /Volumes/sysos/ || true
          rm -f dmgs/087-86593-047.dmg
      - name: Mount AppOS cryptex
        run: |
          hdiutil attach dmgs/087-86622-047.dmg -mountpoint /Volumes/appos -nobrowse -readonly || echo "AppOS optional for A11"
          ls /Volumes/appos/ || true
          rm -f dmgs/087-86622-047.dmg
      - name: Create 12G HFS+ root image
        run: |
          hdiutil create -size 12g -fs "Case-sensitive HFS+" -volname iOSRoot ios16-root.dmg
          hdiutil attach ios16-root.dmg -mountpoint /Volumes/iOSRoot -nobrowse
          ls /Volumes/iOSRoot/
          df -h /
      - name: Copy OS root
        run: |
          rm -f dmgs/087-86698-044.dmg
          df -h /
          sudo rsync -aH --numeric-ids /Volumes/os/ /Volumes/iOSRoot/
          df -h /
          df -h /
          df -h /
      - name: Copy cryptexes
        run: |
          sudo mkdir -p /Volumes/iOSRoot/private/preboot/Cryptexes/OS
          sudo mkdir -p /Volumes/iOSRoot/private/preboot/Cryptexes/App
          sudo rsync -aH --numeric-ids /Volumes/sysos/ /Volumes/iOSRoot/private/preboot/Cryptexes/OS/
          if [ -d /Volumes/appos ]; then sudo rsync -aH --numeric-ids /Volumes/appos/ /Volumes/iOSRoot/private/preboot/Cryptexes/App/; else echo "AppOS skipped"; fi
      - name: dyld cache hard links
        run: |
          sudo mkdir -p /Volumes/iOSRoot/System/Library/Caches/com.apple.dyld
          for f in /Volumes/iOSRoot/private/preboot/Cryptexes/OS/System/Library/Caches/com.apple.dyld/*; do
            sudo ln "$f" /Volumes/iOSRoot/System/Library/Caches/com.apple.dyld/$(basename $f) 2>/dev/null || true
          done
      - name: Cryptex hard links
        run: |
          for c in OS App; do
            cd /Volumes/iOSRoot/private/preboot/Cryptexes/$c
            sudo find . ! -type d ! -path './System/Library/Caches/com.apple.dyld/*' | while IFS= read -r f; do
              f=${f#./}
              if [ ! -e /Volumes/iOSRoot/$f ] && [ ! -L /Volumes/iOSRoot/$f ]; then
                sudo mkdir -p /Volumes/iOSRoot/$(dirname $f)
                src=/Volumes/iOSRoot/private/preboot/Cryptexes/$c/$f
                if [ -L "$src" ]; then sudo cp -P "$src" /Volumes/iOSRoot/$f; else sudo ln "$src" /Volumes/iOSRoot/$f; fi
              fi
            done
          done
      - name: System keybag
        run: |
          sudo mkdir -p /Volumes/iOSRoot/private/var/keybags
          sudo install -m 0600 -o 0 -g 0 /dev/null /Volumes/iOSRoot/private/var/keybags/systembag.kb
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>KeyBagKeys</key><data>U1dGUlVRQQ==</data></dict></plist>' | sudo tee /Volumes/iOSRoot/private/var/keybags/systembag.kb >/dev/null
      - name: Detach all
        run: |
          hdiutil detach /Volumes/os -force || true
          hdiutil detach /Volumes/sysos -force || true
          hdiutil detach /Volumes/appos -force || true
          hdiutil detach /Volumes/iOSRoot -force || true
          rm -rf dmgs
          df -h /
      - name: Compress
        run: |
          gzip -1 ios16-root.dmg
          ls -la ios16-root.dmg.gz
      - name: Publish to release
        run: |
          gh release upload qemu-demo ios16-root.dmg.gz d22ap.adt --clobber -R zjh3215588/ios-vince
        env:
          GH_TOKEN: ${{ github.token }}
