name: ios-root
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y hfsprogs rsync android-sdk-libsparse-utils jq g++ cmake libfuse3-dev libbz2-dev zlib1g-dev 7zip
      - name: Build apfs-fuse from source
        run: |
          git clone --recursive --depth 1 https://github.com/sgan81/apfs-fuse.git
          cd apfs-fuse
          mkdir b && cd b
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j2
          sudo cp apfs-fuse /usr/local/bin/
      - name: Download ipsw CLI
        run: |
          curl -sL -o ipsw.tar.gz "https://github.com/blacktop/ipsw/releases/download/v3.1.741/ipsw_3.1.741_linux_x86_64.tar.gz"
          tar xzf ipsw.tar.gz
          ./ipsw version
      - name: Download IPSW
        run: |
          curl -sS -L --retry 3 -o ipsw.ipsw "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          ls -la ipsw.ipsw
          sha256sum ipsw.ipsw
      - name: Extract DMGs and DeviceTree
        run: |
          mkdir -p work/dmgs
          7z x -owork/dmgs ipsw.ipsw "*.dmg" -bso0 -bsp0
          7z x -owork/dt ipsw.ipsw "*DeviceTree.d22ap.im4p" -bso0 -bsp0
          ls -laS work/dmgs/
          echo "=== OS dmg tail verification (expect koly) ==="
          tail -c 512 work/dmgs/087-86698-044.dmg | od -c | head -2 || true
      - name: Extract DeviceTree ADT
        run: |
          DT=$(find work/dt -name "*.im4p" | head -1)
          ./ipsw img4 im4p extract "$DT" -o d22ap.adt || echo "DT optional"
          ls -la d22ap.adt || true
      - name: apfs-fuse verbose debug
        run: |
          sudo mkdir -p /mnt/test
          sudo apfs-fuse work/dmgs/087-86698-044.dmg /mnt/test -o dbg_level=15 2>&1 | head -60 || true
          sudo umount /mnt/test 2>/dev/null || true
      - name: Build iOS root (mkiosroot, adaptive mount)
        run: |
          cd work/dmgs
          OS=$(ls -S *.dmg | head -1)
          SYSOS=$(ls -S *.dmg | head -2 | tail -1)
          APPOS=$(ls -S *.dmg | head -3 | tail -1)
          echo "OS=$OS SYSOS=$SYSOS APPOS=$APPOS"
          cd ../..
          sudo bash tools/mkiosroot.sh "work/dmgs/$OS" "work/dmgs/$SYSOS" "work/dmgs/$APPOS" /mnt/ios16-root.img 16G
      - name: Apply vince tweaks
        run: |
          sudo mkdir -p /mnt/iosroot
          sudo mount -t hfsplus -o loop,force /mnt/ios16-root.img /mnt/iosroot
          sudo python3 tools/sweet-root-tweaks.py /mnt/iosroot
          sync
          sudo umount /mnt/iosroot
      - name: Convert to sparse
        run: |
          img2simg /mnt/ios16-root.img ios16-root.simg
          rm -f /mnt/ios16-root.img
          ls -la ios16-root.simg
          df -h /mnt
      - name: Publish to release
        run: |
          gh release upload qemu-demo ios16-root.simg d22ap.adt --clobber -R zjh3215588/ios-vince
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root
          path: |
            ios16-root.simg
            d22ap.adt
