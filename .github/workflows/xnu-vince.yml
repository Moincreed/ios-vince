name: xnu-vince

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: VINCE
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "tools/patch_dxb.py"
      - ".github/workflows/xnu-vince.yml"

permissions:
  contents: write

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'VINCE' }}

jobs:
  build:
    # macos-14 ships Xcode 15.x whose iig matches the xnu-8796 IORPC ABI
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # Copy Vince-specific and open-source Darwin patches
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # Patch dxb/build.sh: arm64 support for libfirehose and target-aware patch basename loop for Vince
          python3 tools/patch_dxb.py dxb/build.sh
          grep -c 'VALID_ARCHS="arm64"' dxb/build.sh
          ls dxb/patches

      - name: Dependencies
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      # The Kernel Debug Kit (~650 MB, GitHub release asset of dortania/KdkSupportPkg) is downloaded by build.sh with
      # no retry or check; two runs in a row failed with "hdiutil: attach failed - image not recognized". Cache it,
      # and download with retries + sha256 check, then install it so build.sh skips its own download.
      - name: Cache Kernel Debug Kit
        id: kdk-cache
        uses: actions/cache@v4
        with:
          path: ~/kdk-cache
          key: kdk-${{ env.MACOS_VERSION }}-v1

      - name: Fetch and install Kernel Debug Kit
        run: |
          set -e
          NAME=$(grep -A3 "'${MACOS_VERSION}')" dxb/build.sh | sed -n "s/.*KDK_NAME='\(.*\)'.*/\1/p" | head -1)
          ROOT=$(grep -A3 "'${MACOS_VERSION}')" dxb/build.sh | sed -n "s/.*KDKROOT='\(.*\)'.*/\1/p" | head -1)
          echo "KDK: $NAME -> $ROOT"
          [ -d "$ROOT" ] && { echo "already installed"; exit 0; }
          MAN=$(curl -fsSL --retry 5 https://raw.githubusercontent.com/dortania/KdkSupportPkg/gh-pages/manifest.json)
          URL=$(echo "$MAN" | jq -r --arg n "$NAME" '.[] | select(.name==$n) | .url')
          SHA=$(echo "$MAN" | jq -r --arg n "$NAME" '.[] | select(.name==$n) | .sha256sum')
          mkdir -p ~/kdk-cache
          DMG=~/kdk-cache/KDK.dmg
          for i in 1 2 3 4 5; do
            if [ -f "$DMG" ] && [ "$(shasum -a 256 "$DMG" | cut -d' ' -f1)" = "$SHA" ]; then break; fi
            echo "download attempt $i"
            rm -f "$DMG"
            curl -fL --retry 3 --connect-timeout 60 --max-time 1200 -o "$DMG" "$URL" || true
            sleep 10
          done
          [ "$(shasum -a 256 "$DMG" | cut -d' ' -f1)" = "$SHA" ] || { echo "KDK download failed checksum"; ls -la "$DMG"; head -c 300 "$DMG"; exit 1; }
          hdiutil attach "$DMG"
          sudo installer -pkg '/Volumes/Kernel Debug Kit/KernelDebugKit.pkg' -target /
          hdiutil detach '/Volumes/Kernel Debug Kit'
          ls -lah /Library/Developer/KDKs

      - name: Build XNU Kernel for Vince
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform || true
          ls -la buildtree.tgz || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Collect Output
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-vince
          path: out/
          if-no-files-found: warn

      # The kernel also goes to the kernel-builds branch (one commit, replaced each build), so it can be fetched with
      # plain git where artifact downloads (blob storage) are blocked.
      - name: Publish kernel to kernel-builds branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          test -f out/kernel.development.vince || { echo "no kernel"; exit 0; }
          rm -rf kb && mkdir kb && cd kb
          git init -q -b kernel-builds
          cp ../out/kernel.development.vince ../out/SHA256SUMS .
          echo "${{ github.sha }}" > SOURCE_COMMIT
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "kernel for ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" kernel-builds
